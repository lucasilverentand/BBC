name: Validate BBC
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  transport:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: swift build
      - run: python3 script/test_swift.py .
  native:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: bash script/prepare_icon.sh
      - run: bash script/prepare_native.sh
      - run: python3 script/test_swift.py NativeMessages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bbc-native-validation
          path: NativeMessages/.build/debug/BlueBubbleClub
          if-no-files-found: error
          retention-days: 1
