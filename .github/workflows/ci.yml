name: Validate BBC
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portable-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install fixture and SQLite dependencies
        run: apt-get update && apt-get install -y --no-install-recommends python3 libsqlite3-dev
      - run: python3 -m unittest discover -s script -p 'test_*.py'
      - run: python3 script/test_swift.py .
  transport:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -m unittest discover -s script -p 'test_*.py'
      - run: swift build
      - run: python3 script/test_swift.py .
  native:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: bash script/prepare_icon.sh
      - run: bash script/prepare_bridge.sh
      - name: Verify Messages bridge ABI
        run: |
          for arch in arm64 arm64e x86_64; do
            xcrun lipo -verify_arch "$arch" build/NativeBridge/BBCMessagesBridge.dylib
          done
          test "$(xcrun vtool -show-build build/NativeBridge/BBCMessagesBridge.dylib | awk '$1 == "platform" {print $2}' | sort -u)" = MACCATALYST
      - run: python3 script/test_swift.py NativeBridge
      - run: bash script/prepare_native.sh
      - run: python3 script/test_swift.py NativeMessages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bbc-native-validation
          path: |
            NativeMessages/.build/debug/BlueBubbleClub
            build/NativeBridge/BBCMessagesBridge.dylib
          if-no-files-found: error
          retention-days: 1
