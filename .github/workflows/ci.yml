name: Validate BBC
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portable-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-jammy
    timeout-minutes: 10
    env:
      BBC_TEST_TIMEOUT_SECONDS: 480
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install fixture and SQLite dependencies
        run: apt-get update && apt-get install -y --no-install-recommends python3 libsqlite3-dev
      - run: python3 -m unittest discover -s script -p 'test_*.py'
      - run: python3 script/test_swift.py . --min-tests 16 --log build/test-logs/linux.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: bbc-linux-test-logs
          path: build/test-logs/
          if-no-files-found: ignore
          retention-days: 3
  transport:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      BBC_TEST_TIMEOUT_SECONDS: 480
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -m unittest discover -s script -p 'test_*.py'
      - run: /usr/bin/ruby script/test_release.rb
      - run: python3 script/test_swift.py . --min-tests 25 --log build/test-logs/sdk.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: bbc-transport-test-logs
          path: build/test-logs/
          if-no-files-found: ignore
          retention-days: 3
  native:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      BBC_TEST_TIMEOUT_SECONDS: 600
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify unsigned release build, suites, bridge ABI and icon
        run: bash script/validate_hosted_toolchain.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bbc-native-validation
          path: |
            build/toolchain-evidence/
            build/test-logs/
          if-no-files-found: error
          retention-days: 3
