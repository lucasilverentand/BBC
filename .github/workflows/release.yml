name: Notarized release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed main tag (vX.Y.Z)
        required: true
        type: string
permissions: {}
concurrency:
  group: notarized-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'lucasilverentand/BBC' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag against reviewed workflow source
        id: source
        env:
          BBC_RELEASE_TAG: ${{ inputs.tag }}
        run: ruby script/ci_release.rb verify

  sign:
    needs: verify
    if: github.repository == 'lucasilverentand/BBC' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      BBC_RELEASE_TAG: ${{ inputs.tag }}
      BBC_RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
      BBC_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve reviewed release tools and detach to the verified source
        run: |
          /usr/bin/ruby script/ci_release.rb verify
          mkdir -m 700 "$RUNNER_TEMP/bbc-release-tools"
          cp script/version.rb script/release.rb script/ci_release.rb script/ci_release_sign.rb script/ci_release_toolchain.rb "$RUNNER_TEMP/bbc-release-tools/"
          git checkout --detach "$BBC_RELEASE_COMMIT"
      - name: Require the supported release toolchain
        run: |
          test "$(uname -m)" = arm64 || { echo 'An Apple Silicon runner is required'; exit 1; }
          /usr/bin/ruby "$RUNNER_TEMP/bbc-release-tools/ci_release_toolchain.rb"
      - name: Recheck the exact release checkout before credential access
        run: /usr/bin/ruby "$RUNNER_TEMP/bbc-release-tools/ci_release.rb" checkout
      - name: Sign, notarize, staple and assess
        env:
          BBC_DEVELOPER_ID_P12_BASE64: ${{ secrets.BBC_DEVELOPER_ID_P12_BASE64 }}
          BBC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.BBC_DEVELOPER_ID_P12_PASSWORD }}
          BBC_ASC_KEY_P8: ${{ secrets.BBC_ASC_KEY_P8 }}
          BBC_ASC_KEY_ID: ${{ secrets.BBC_ASC_KEY_ID }}
          BBC_ASC_ISSUER_ID: ${{ secrets.BBC_ASC_ISSUER_ID }}
        run: /usr/bin/ruby "$RUNNER_TEMP/bbc-release-tools/ci_release_sign.rb"
      - name: Clean signing state even after failure or cancellation
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/bbc-release-tools/ci_release_sign.rb"; then
            /usr/bin/ruby "$RUNNER_TEMP/bbc-release-tools/ci_release_sign.rb" --cleanup
          fi
      - name: Validate the exact files handed to the publisher
        env:
          BBC_RELEASE_ARTIFACTS: build/release/${{ inputs.tag }}
        run: /usr/bin/ruby "$RUNNER_TEMP/bbc-release-tools/ci_release.rb" artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: notarized-release
          path: |
            build/release/${{ inputs.tag }}/BlueBubbleClub-*-macos-arm64.zip
            build/release/${{ inputs.tag }}/manifest.json
            build/release/${{ inputs.tag }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, sign]
    if: github.repository == 'lucasilverentand/BBC' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: write
    env:
      BBC_RELEASE_TAG: ${{ inputs.tag }}
      BBC_RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: ${{ runner.temp }}/bbc-notarized-artifacts
          merge-multiple: true
      - name: Verify artifact provenance and checksums
        env:
          BBC_RELEASE_ARTIFACTS: ${{ runner.temp }}/bbc-notarized-artifacts
        run: ruby script/ci_release.rb artifacts
      - name: Recheck remote tag and create the reviewed draft
        env:
          BBC_RELEASE_ARTIFACTS: ${{ runner.temp }}/bbc-notarized-artifacts
          GH_TOKEN: ${{ github.token }}
        run: ruby script/ci_release.rb draft
